[project]
name = "hermes-ha-assist"
version = "0.2.3"
description = "Home Assistant Assist conversation integration for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
